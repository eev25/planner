<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply a saved dark choice before first paint to avoid a light flash.
      // Light is the default regardless of the OS setting. Keep in sync with useTheme.
      (function () {
        var t = 'light';
        try { if (localStorage.getItem('theme') === 'dark') t = 'dark'; } catch (e) {}
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <title>Yearly Planner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
